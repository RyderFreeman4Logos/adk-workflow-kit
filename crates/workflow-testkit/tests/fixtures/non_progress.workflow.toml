# REVIEW-003: statically unrolled revisit loop for no-progress detection.
#
# The compiler rejects directed cycles (ADR-0009), so the bounded repair
# loop is expressed as 24 unrolled review -> revise hops. The walk's
# NonProgressDetector must abstain at the borrowed RUN-002 model-turn cap
# (MODEL_TURNS_BOUND) long before the fixture tail, while a progressing
# walk may still reach publish through any review node.

schema_version = 1

[workflow]
id = "review.non-progress"
version = "1"
entry = "produce"

[[nodes]]
id = "produce"
kind = "agent"

[[nodes]]
id = "validate"
kind = "validator"

[[nodes]]
id = "validate-final"
kind = "validator"

[[nodes]]
id = "publish"
kind = "terminal"

[[nodes]]
id = "abstain"
kind = "terminal"

[[nodes]]
id = "fail"
kind = "terminal"

[[edges]]
from = "produce"
to = "validate"

[[routes]]
from = "validate"
predicate = { id = "validator.verdict@v1", version = "1.0.0" }
cases = { pass = "review-1", fail = "fail" }

[[routes]]
from = "validate-final"
predicate = { id = "final-validator.verdict@v1", version = "1.0.0" }
cases = { pass = "publish", fail = "fail" }

[[nodes]]
id = "review-1"
kind = "agent"

[[nodes]]
id = "revise-1"
kind = "agent"

[[routes]]
from = "review-1"
predicate = { id = "reviewer.verdict@v1", version = "1.0.0" }
cases = { pass = "validate-final", revise = "revise-1", abstain = "abstain" }

[[edges]]
from = "revise-1"
to = "review-2"

[[nodes]]
id = "review-2"
kind = "agent"

[[nodes]]
