[package]
name = "adk-2-1-ownership"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false

[dependencies]
adk-rust = { version = "=2.1.0", default-features = false, features = ["agents", "graph"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "1.0.149"