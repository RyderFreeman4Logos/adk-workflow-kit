[workspace]
resolver = "2"
members = [
    "crates/workflow-spec",
    "crates/workflow-ir",
    "crates/workflow-compiler",
    "crates/workflow-testkit",
    "crates/workflow-adk",
    "crates/workflow-runtime",
    "crates/workflow-review",
    "crates/workflowctl",
    "spikes/adk-2-1-ownership",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/RyderFreeman4Logos/adk-workflow-kit"

[workspace.dependencies]
adk-rust = { version = "=2.3.0", default-features = false, features = ["agents", "models", "graph", "guardrail", "telemetry", "openai", "sessions", "runner"] }
clap = "4.6.1"
jsonschema = { version = "=0.45.1", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
thiserror = "2.0.20"
toml = "0.9.12"
wasmi = "=0.41.3"

[patch.crates-io]
# Keep the released umbrella and one delivered source identity for the schema and graph fixes.
adk-core = { git = "https://github.com/RyderFreeman4Logos/adk-rust.git", rev = "9761d14823008a96a558716e4883ac118d9143ff" }
adk-graph = { git = "https://github.com/RyderFreeman4Logos/adk-rust.git", rev = "9761d14823008a96a558716e4883ac118d9143ff" }
adk-action = { git = "https://github.com/RyderFreeman4Logos/adk-rust.git", rev = "9761d14823008a96a558716e4883ac118d9143ff" }
adk-model = { git = "https://github.com/RyderFreeman4Logos/adk-rust.git", rev = "9761d14823008a96a558716e4883ac118d9143ff" }
