no_tty: true

pre-commit:
  piped: true
  commands:
    branch-protection:
      run: just check-branch
    local-gates:
      run: just pre-commit-fast
    release-profile:
      run: just issue-323-release-consumer

pre-push:
  commands:
    local-gates:
      run: just pre-push
      use_stdin: true
